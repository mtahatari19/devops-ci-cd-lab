stages:
  - validate
  - build
  - test
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: devops-ci-cd-lab
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker

validate:
  stage: validate
  script:
    - echo "Validating repository structure..."
    - test -f Dockerfile
    - test -f docker-compose.yml
    - test -f nginx/nginx.conf
    - test -f app/index.html
    - echo "Validation passed."

build:
  stage: build
  script:
    - echo "Building Docker image..."
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save "$IMAGE_NAME:$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

test:
  stage: test
  before_script:
    - apk add --no-cache curl
  script:
    - docker load -i image.tar
    - docker run -d --name devops-ci-cd-test -p 8080:80 "$IMAGE_NAME:$IMAGE_TAG"
    - sleep 5
    - curl --fail http://docker:8080/
    - curl --fail http://docker:8080/health
    - docker inspect --format='{{.State.Health.Status}}' devops-ci-cd-test
    - echo "Application tests passed."
  dependencies:
    - build

publish:
  stage: publish
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
